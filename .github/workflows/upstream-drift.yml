name: Upstream drift

on:
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift:
    name: Pinned crush migrations vs capability guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Guard self-test (doctored fixture must fire)
        run: scripts/check-upstream-drift.sh --self-test

      - name: Check upstream migration drift
        run: scripts/check-upstream-drift.sh

  release-notice:
    name: Open issue on new crush stable release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect new stable release and open tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-upstream-release.sh
