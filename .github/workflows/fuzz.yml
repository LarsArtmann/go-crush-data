name: Nightly fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [
          FuzzDecodeParts,
          FuzzDecodeTodos,
          FuzzParseProjectsOutput,
          FuzzLoadRegistry,
        ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.target }} for 90s
        id: fuzz
        continue-on-error: true
        run: |
          set +e
          go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 90s . 2>&1 | tee fuzz.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload crashers and log
        if: steps.fuzz.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-crashers
          path: |
            fuzz.log
            testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the job on a crasher
        if: steps.fuzz.outcome != 'success'
        run: exit 1
